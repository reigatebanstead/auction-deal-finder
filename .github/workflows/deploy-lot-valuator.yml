name: Deploy lot-valuator to Apify

on:
  push:
    branches:
      - main
    paths:
      - 'actors/lot-valuator/**'
      - '.github/workflows/deploy-lot-valuator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lot-valuator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: actors/lot-valuator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Install Apify CLI
        run: npm install -g apify-cli

      - name: Login to Apify
        run: apify login --token "$APIFY_TOKEN"
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Verify Apify authentication
        run: |
          APIFY_USER=$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/users/me" | jq -r '.data.username')
          if [ -z "$APIFY_USER" ] || [ "$APIFY_USER" = "null" ]; then
            echo "::error::Apify authentication failed — token may be missing or invalid"
            exit 1
          fi
          echo "Authenticated as Apify user: $APIFY_USER"
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Deploy to Apify
        run: apify push valorous_ocarina/auction-deal-finder
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Verify deployed input schema
        run: |
          echo "Checking deployed input schema for required fields..."
          SCHEMA=".actor/INPUT_SCHEMA.json"
          for FIELD in batchSize testGeminiComparables comparableQuery comparableLimit; do
            HAS=$(jq --arg f "$FIELD" '.properties | has($f)' "$SCHEMA")
            if [ "$HAS" != "true" ]; then
              echo "::error::Deployed input schema is missing required field: $FIELD"
              exit 1
            fi
          done
          echo "Input schema OK."

      - name: Smoke test Gemini comparables mode
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "Starting synchronous smoke-test run..."

          # The documented synchronous endpoint passes this JSON body directly as
          # the Actor INPUT and returns the default dataset items. This avoids the
          # previous incorrect run-status polling URL and proves test mode was used.
          curl --silent --show-error --fail-with-body \
            --max-time 240 \
            -X POST \
            -H "Authorization: Bearer $APIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"testGeminiComparables":true,"comparableQuery":"Royal Doulton stoneware vase signed 1920s","comparableLimit":10}' \
            "https://api.apify.com/v2/actors/valorous_ocarina~auction-deal-finder/run-sync-get-dataset-items?timeout=180&format=json&clean=true" \
            -o /tmp/smoke-items.json

          ITEM_COUNT=$(jq 'length' /tmp/smoke-items.json)
          echo "Dataset items returned: $ITEM_COUNT"

          if [ "$ITEM_COUNT" != "1" ]; then
            echo "::error::Expected exactly 1 dataset item, got $ITEM_COUNT"
            cat /tmp/smoke-items.json
            exit 1
          fi

          for FIELD in soldCount activeCount sellThroughRate liquidityAssessment soldListings activeListings errors; do
            HAS=$(jq --arg f "$FIELD" '.[0] | has($f)' /tmp/smoke-items.json)
            if [ "$HAS" != "true" ]; then
              echo "::error::Smoke test result is missing required field: $FIELD"
              cat /tmp/smoke-items.json
              exit 1
            fi
          done

          ERRORS_TYPE=$(jq -r '.[0].errors | type' /tmp/smoke-items.json)
          if [ "$ERRORS_TYPE" != "array" ]; then
            echo "::error::Field 'errors' must be an array, got: $ERRORS_TYPE"
            exit 1
          fi

          echo "Smoke test passed."
