name: Test lot-valuator

on:
  pull_request:
    branches:
      - main
    paths:
      - 'actors/lot-valuator/**'
      - '.github/workflows/test-lot-valuator.yml'
  push:
    branches:
      - main
    paths:
      - 'actors/lot-valuator/**'
      - '.github/workflows/test-lot-valuator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lot-valuator-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 20 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: actors/lot-valuator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: actors/lot-valuator/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
